      # This gives PERSISTENT storage (orders, users, sessions survive restarts/redeploys).
      # Leave unset to use JSON files in ./data (ephemeral on Render free tier).
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_FLOAT_NUMBER
        value: 2348122104576
      - key: WHATSAPP_ORDER_NUMBER
        value: 2348122104576
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_STRONG_PASSWORD
      - key: FLUTTERWAVE_SECRET_KEY
        value: FSTOU9su2xlF8UU8wU05kNvqEbI8v47S
