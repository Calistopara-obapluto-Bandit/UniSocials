services:
  - type: web
    name: unisocials
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # ─────────────────────────────────────────────────────────────────────────
      # PERSISTENT STORAGE — pick ONE option below:
      #
      # OPTION 1 (recommended): You ALREADY have a free PostgreSQL on Render.
      #   The PgHero monitoring link you see (pghero-dpg-xxxx-a.onrender.com) is
      #   just the dashboard for an EXISTING database instance (id: dpg-xxxx).
      #   In the Render dashboard go to:
      #     Dashboard → Databases → open your PostgreSQL instance
      #     → tab "Connect" → copy the "Internal Database URL"
      #   Paste that full postgres://... string as the DATABASE_URL value below.
      #   The app will auto-create its tables on first boot. No new DB needed.
      #
      # OPTION 2: Free external PostgreSQL (if you truly cannot use a Render DB).
      #   Create a free database at Neon (neon.tech) or Supabase, copy the
      #   connection string, and paste it here. Works exactly the same.
      #
      # OPTION 3: No database at all.
      #   Leave DATABASE_URL empty/unset → the app falls back to JSON files in
      #   ./data. NOTE: on Render's free tier the disk is ephemeral, so orders
      #   may be lost on restart/redeploy. Use this only for quick testing.
      # ─────────────────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_FLOAT_NUMBER
        value: 2348122104576
      - key: WHATSAPP_ORDER_NUMBER
        value: 2348122104576
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_STRONG_PASSWORD
      - key: FLUTTERWAVE_SECRET_KEY
        value: FSTOU9su2xlF8UU8wU05kNvqEbI8v47S
      - key: FLUTTERWAVE_PUBLIC_KEY
        value: FLWPUBK-30d580ee6aef13a294e26a8c1145dc58-X
      - key: FLUTTERWAVE_BANK_NAME
        value: Flutterwave MfB (formerly ok mfb)
      - key: FLUTTERWAVE_ACCOUNT_NUMBER
        value: "9707788756"
      # Flutterwave webhook secret hash (Dashboard → Settings → Webhooks)
      - key: FLUTTERWAVE_WEBHOOK_HASH
        value: Soludo123@
      - key: SITE_URL
        value: https://unisocials.onrender.com
      - key: CONTACT_EMAIL
        value: support.sbiamautos@gmail.com
      - key: FORMSUBMIT_KEY
        value: support.sbiamautos@gmail.com
      - key: REDIRECT_URL
        value: https://unisocials.onrender.com/thank-you.html

