services:
  - type: web
    name: unisocials
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # ─────────────────────────────────────────────────────────────────────────
      # PERSISTENT STORAGE — PostgreSQL (Neon external DB, connections survive
      # Render free-tier restarts/redeploys). Tables are auto-created on boot.
      #
      # ⚠️ SECURITY: Set DATABASE_URL in the Render dashboard (Environment → Env Vars)
      # instead of here, so the DB password is never committed to the repo.
      # Example value:
      #   DATABASE_URL=postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      # If DATABASE_URL is not set, the server falls back to JSON files in ./data.
      # ─────────────────────────────────────────────────────────────────────────
      - key: WHATSAPP_FLOAT_NUMBER
        value: 2348122104576
      - key: WHATSAPP_ORDER_NUMBER
        value: 2348122104576
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_STRONG_PASSWORD
      - key: FLUTTERWAVE_SECRET_KEY
        value: FSTOU9su2xlF8UU8wU05kNvqEbI8v47S
      - key: FLUTTERWAVE_PUBLIC_KEY
        value: FLWPUBK-30d580ee6aef13a294e26a8c1145dc58-X
      - key: FLUTTERWAVE_BANK_NAME
        value: Flutterwave MfB (formerly ok mfb)
      - key: FLUTTERWAVE_ACCOUNT_NUMBER
        value: "9707788756"
      # Flutterwave webhook secret hash (Dashboard → Settings → Webhooks)
      - key: FLUTTERWAVE_WEBHOOK_HASH
        value: Soludo123@
      - key: SITE_URL
        value: https://unisocials.onrender.com
      - key: CONTACT_EMAIL
        value: support.sbiamautos@gmail.com
      - key: FORMSUBMIT_KEY
        value: support.sbiamautos@gmail.com
      - key: REDIRECT_URL
        value: https://unisocials.onrender.com/thank-you.html

      # ─────────────────────────────────────────────────────────────────────────
      # EMAIL NOTIFICATIONS (Resend)
      #   • ADMIN_EMAIL gets an instant alert for every new order awaiting payment
      #     verification AND for every confirmed payment
      #   • Buyer gets a confirmation email with their ticket QR links
      #
      # ⚠️ SECURITY: Set RESEND_API_KEY in the Render dashboard (Environment → Env Vars)
      # so the key is never committed to the repo (GitHub secret scanning rejects
      # commits containing live API keys — see the .env file locally for the value).
      #
      # 👉 REQUIRED: In Render dashboard → unisocials → Environment → Env Vars,
      #    add:  RESEND_API_KEY = re_JFNfNZsY_...   (your live Resend key)
      #
      # After verifying a custom domain in Resend, set EMAIL_FROM to your domain.
      # ─────────────────────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: soludobenedict5@gmail.com
      - key: EMAIL_FROM
        value: UNN Socials <onboarding@resend.dev>


