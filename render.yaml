services:
  - type: web
    name: unisocials
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # ─────────────────────────────────────────────────────────────────────────
      # PERSISTENT STORAGE — PostgreSQL (Neon external DB, connections survive
      # Render free-tier restarts/redeploys). Tables are auto-created on boot.
      #
      # ⚠️ SECURITY: Set DATABASE_URL in the Render dashboard (Environment → Env Vars)
      # instead of here, so the DB password is never committed to the repo.
      # Example value:
      #   DATABASE_URL=postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      # If DATABASE_URL is not set, the server falls back to JSON files in ./data.
      # ─────────────────────────────────────────────────────────────────────────
      - key: WHATSAPP_FLOAT_NUMBER
        value: 2348122104576
      - key: WHATSAPP_ORDER_NUMBER
        value: 2348122104576
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_STRONG_PASSWORD
      - key: FLUTTERWAVE_SECRET_KEY
        value: FSTOU9su2xlF8UU8wU05kNvqEbI8v47S
      - key: FLUTTERWAVE_PUBLIC_KEY
        value: FLWPUBK-30d580ee6aef13a294e26a8c1145dc58-X
      - key: FLUTTERWAVE_BANK_NAME
        value: Flutterwave MfB (formerly ok mfb)
      - key: FLUTTERWAVE_ACCOUNT_NUMBER
        value: "9707788756"
      # Flutterwave webhook secret hash (Dashboard → Settings → Webhooks)
      - key: FLUTTERWAVE_WEBHOOK_HASH
        value: Soludo123@
      - key: SITE_URL
        value: https://unisocials.onrender.com
      - key: CONTACT_EMAIL
        value: support.sbiamautos@gmail.com
      - key: FORMSUBMIT_KEY
        value: support.sbiamautos@gmail.com
      - key: REDIRECT_URL
        value: https://unisocials.onrender.com/thank-you.html

      # ─────────────────────────────────────────────────────────────────────────
      # EMAIL NOTIFICATIONS
      #   • ADMIN_EMAIL gets an instant alert for every new order awaiting payment
      #     verification AND for every confirmed payment (sent via Resend — works
      #     because it only needs to reach YOUR inbox).
      #   • Buyer gets a confirmation email with their ticket QR links. Sent via
      #     BREVO (free tier, NO domain required — you only verify a sender email
      #     address at https://app.brevo.com → Senders) so tickets reach clients.
      #
      # ⚠️ SECURITY: Set these in the Render dashboard (Environment → Env Vars),
      #    never in the repo — GitHub secret scanning rejects live API keys.
      #    See local .env / .env.example for the values.
      #
      # 👉 REQUIRED (Render dashboard → unisocials → Environment → Env Vars):
      #    RESEND_API_KEY      = your Resend key (admin alerts)
      #    BREVO_API_KEY       = your Brevo SMTP API key (buyer emails — no domain)
      #    BREVO_SENDER_EMAIL  = the verified sender email (e.g. support.sbiamautos@gmail.com)
      #    EMAIL_FROM          = Unisocials <onboarding@resend.dev> (Resend fallback)
      # ─────────────────────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: support.sbiamautos@gmail.com
      - key: BREVO_SENDER_NAME
        value: Unisocials
      - key: ADMIN_EMAIL
        value: soludobenedict5@gmail.com
      - key: EMAIL_FROM
        value: Unisocials <onboarding@resend.dev>


